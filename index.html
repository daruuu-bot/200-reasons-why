<style>
  :root{
    --night-deep: #0d0a2b;
    --night: #1a1440;
    --indigo: #2d2359;
    --plum: #4a2f6e;
    --candle: #ffb84d;
    --candle-hot: #fff2c9;
    --gold: #e8c17d;
    --lavender: #c9b6e4;
    --cream: #faf3e6;
    --cream-dim: #d9cfe8;
    --shadow: 0 20px 50px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background:
      radial-gradient(ellipse 60% 40% at 20% 15%, rgba(74,47,110,0.55), transparent 60%),
      radial-gradient(ellipse 50% 35% at 85% 75%, rgba(45,35,89,0.6), transparent 60%),
      linear-gradient(180deg, var(--night-deep) 0%, var(--night) 55%, var(--indigo) 100%);
    font-family: 'Quicksand', sans-serif;
    color: var(--cream);
    overflow-x: hidden;
    background-attachment: fixed;
  }

  #stars {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 1;
    pointer-events: none;
  }
  .star {
    position: absolute;
    background: var(--cream);
    border-radius: 50%;
    animation: twinkle ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.15; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.15); }
  }
  .shooting-star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: linear-gradient(90deg, var(--cream), transparent);
    border-radius: 50%;
    opacity: 0;
    animation: shoot 4.5s ease-in infinite;
  }
  @keyframes shoot {
    0% { opacity: 0; transform: translate(0,0) rotate(-35deg) scaleX(1); }
    3% { opacity: 1; }
    18% { opacity: 0; transform: translate(-260px, 190px) rotate(-35deg) scaleX(45); }
    100% { opacity: 0; }
  }

  .heart {
    position: absolute;
    bottom: -10%;
    font-size: 16px;
    opacity: 0;
    animation: floatUp linear infinite;
    color: var(--lavender);
    filter: drop-shadow(0 0 6px rgba(201,182,228,0.5));
  }
  @keyframes floatUp {
    0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    12% { opacity: 0.5; }
    50% { transform: translateY(-55vh) translateX(15px) rotate(15deg); }
    88% { opacity: 0.3; }
    100% { transform: translateY(-105vh) translateX(-15px) rotate(-10deg); opacity: 0; }
  }

  .candle-wrap {
    position: relative;
    width: 56px;
    height: 118px;
    margin: 0 auto 6px;
  }
  .candle-glow {
    position: absolute;
    left: 50%;
    top: -6px;
    width: 160px;
    height: 160px;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(255,184,77,0.55) 0%, rgba(255,184,77,0.18) 40%, transparent 70%);
    animation: glowPulse 2.4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.75; transform: translateX(-50%) scale(1); }
    50% { opacity: 1; transform: translateX(-50%) scale(1.08); }
  }
  .candle-body {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 30px;
    height: 62px;
    background: linear-gradient(180deg, #fffaf0, #f4e4c9);
    border-radius: 4px 4px 2px 2px;
    box-shadow: inset -4px 0 8px rgba(0,0,0,0.08), 0 6px 14px rgba(0,0,0,0.35);
  }
  .candle-wick {
    position: absolute;
    bottom: 62px;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 8px;
    background: #4a3826;
  }
  .candle-flame {
    position: absolute;
    bottom: 68px;
    left: 50%;
    width: 14px;
    height: 26px;
    transform-origin: bottom center;
    background: radial-gradient(circle at 50% 70%, var(--candle-hot) 0%, var(--candle) 45%, rgba(255,140,40,0.1) 80%);
    border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
    animation: flicker 2.2s ease-in-out infinite;
    filter: drop-shadow(0 0 6px rgba(255,184,77,0.8));
  }
  @keyframes flicker {
    0%, 100% { transform: translateX(-50%) rotate(-2deg) scaleY(1); }
    20% { transform: translateX(-50%) rotate(2deg) scaleY(0.96); }
    40% { transform: translateX(-50%) rotate(-3deg) scaleY(1.05); }
    60% { transform: translateX(-50%) rotate(1deg) scaleY(0.98); }
    80% { transform: translateX(-50%) rotate(-1deg) scaleY(1.03); }
  }
  @media (prefers-reduced-motion: reduce) {
    .candle-flame, .candle-glow, .star, .heart, .shooting-star { animation: none !important; }
  }

  #lockScreen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 20px;
    transition: opacity 0.9s ease, visibility 0.9s ease, transform 0.9s ease;
  }
  #lockScreen.hidden {
    opacity: 0;
    transform: scale(1.05);
    visibility: hidden;
    pointer-events: none;
  }

  .lock-card {
    background: rgba(26, 20, 64, 0.55);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(232, 193, 125, 0.25);
    border-radius: 28px;
    padding: 40px 38px 34px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: var(--shadow);
    animation: riseIn 0.9s cubic-bezier(.2,.8,.2,1);

  @keyframes riseIn {
    from { opacity: 0; transform: translateY(24px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }

  .lock-card h1 {
    font-family: 'Caveat', cursive;
    font-size: 2.3rem;
    margin: 6px 0 2px;
    color: var(--gold);
  }
  .lock-card p.sub {
    margin: 0 0 26px;
    font-size: 0.92rem;
    color: var(--cream-dim);
  }

  #pwInput {

    padding: 14px 16px;
    border-radius: 16px;
    border: 2px solid rgba(232,193,125,0.35);
    background: rgba(13,10,43,0.55);
    font-family: 'Quicksand', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 3px;
    text-align: center;
    color: var(--cream);
    outline: none;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }
  #pwInput::placeholder { color: rgba(250,243,230,0.35); }
  #pwInput:focus {
    border-color: var(--candle);
    box-shadow: 0 0 0 4px rgba(255,184,77,0.18);
  }

  #unlockBtn {
    margin-top: 18px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--candle), #d98f2b);
    color: #2a1a05;
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(255,184,77,0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  #unlockBtn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(255,184,77,0.5); }
  #unlockBtn:active { transform: translateY(0); }

  #pwError {
    margin-top: 14px;
    font-size: 0.85rem;
    color: #ff9f9f;
    min-height: 18px;
    opacity: 0;
    transition: opacity 0.2s ease;

  #pwError.show { opacity: 1; }

  .shake { animation: shake 0.45s; }
  @keyframes shake {
    10%, 90% { transform: translateX(-3px); }
    20%, 80% { transform: translateX(5px); }
    30%, 50%, 70% { transform: translateX(-8px); }
    40%, 60% { transform: translateX(8px); }
  }

  #noteScreen {
    position: relative;
    z-index: 2;
    max-width: 720px;
    margin: 0 auto;
    padding: 50px 22px 100px;
    opacity: 0;
    transform: translateY(18px);
    transition: opacity 1s ease 0.15s, transform 1s ease 0.15s;

  #noteScreen.visible { opacity: 1; transform: translateY(0); }

  .note-header {

    margin-bottom: 46px;

    text-transform: uppercase;
    letter-spacing: 3px;
    font-size: 0.72rem;

    color: transparent;
    margin: 6px 0 8px;
    line-height: 1.05;

  .note-header p {

    right: 16px;

  .reasons-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .reason-row {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 12px 10px;
    border-radius: 12px;
    transition: background 0.2s ease;
  }
  .reason-row:hover { background: rgba(232,193,125,0.06); }

    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 1.3rem;
    color: var(--lavender);
    min-width: 34px;
    text-align: right;
    flex-shrink: 0;

  .reason-text {
    flex: 1;
    min-height: 1.6em;
    border-bottom: 2px dashed rgba(232,193,125,0.3);
    padding: 2px 4px 6px;
    font-size: 1.02rem;
    color: var(--cream);
    line-height: 1.5;
  }
  .reason-text.reason-empty::before {
    content: "still to come…";
    color: rgba(217,207,232,0.4);
    font-style: italic;
  }

  .note-footer {
    text-align: center;
    margin-top: 56px;
    font-family: 'Caveat', cursive;
    font-size: 1.6rem;
    color: var(--gold);

  ::selection { background: rgba(255,184,77,0.35); }

  @media (max-width: 480px) {
    .note-header h1 { font-size: 2.6rem; }
    .reason-num { min-width: 26px; font-size: 1.1rem; }

      text.className = 'reason-text';
